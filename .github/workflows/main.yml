name: KSNU LMS Sync

on:
  schedule:
    - cron: '0 18 * * *' # 매일 한국 시간 새벽 3시 실행
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v4로 업데이트

      - name: Set up Python
        uses: actions/setup-python@v5 # v5로 업데이트
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright ics
          playwright install chromium

      - name: Run LMS Sync Script
        env:
          LMS_ID: ${{ secrets.LMS_ID }}
          LMS_PW: ${{ secrets.LMS_PW }}
        run: python sync_lms.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add ksnu_assignments.ics
          git commit -m "Update LMS assignments [skip ci]" || exit 0
          git push
